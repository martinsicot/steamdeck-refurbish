name: Steam Deck refurb alert

on:
  schedule:
    # Heures en UTC. Jour : toutes les 5 min (:02, :07, :12…, évite :00/:30) ; 4h-22h UTC couvre 6h-minuit
    # à Paris été comme hiver. Nuit : toutes les 15 min (:04, :19, :34, :49) ; 22h-4h UTC couvre 0h-6h à Paris.
    # Le job "gate" garde chaque cron sur sa plage exacte en heure de Paris (jour >= 6h, nuit < 6h).
    - cron: "2-59/5 4-22 * * *"
    - cron: "4-59/15 0-4,22,23 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Envoyer un message Telegram de test"
        type: boolean
        default: false

permissions:
  contents: write   # pour commiter state.json

concurrency:
  group: steamdeck-alert
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        run: |
          h=$(TZ=Europe/Paris date +%-H)
          echo "Heure de Paris : $(TZ=Europe/Paris date +%H:%M) — cron : ${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run=true
          elif [ "${{ github.event.schedule }}" = "4-59/15 0-4,22,23 * * *" ]; then
            # cron de nuit (15 min) : uniquement entre 00:00 et 05:59 à Paris
            [ "$h" -lt 6 ] && run=true || run=false
          else
            # cron de jour (5 min) : uniquement à partir de 06:00 à Paris
            [ "$h" -ge 6 ] && run=true || run=false
          fi
          [ "$run" = true ] || echo "Hors plage pour ce cron : vérification sautée."
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: python check_stock.py

      - name: Screenshot de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 2

      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: stock update"
            git pull --rebase
            git push
          fi
